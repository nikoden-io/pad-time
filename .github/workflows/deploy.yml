# =============================================================================
# PadTime — Pipeline CI/CD
# Déclenché sur push main
# Jobs : tests → build images → push ACR → deploy Container Apps
# =============================================================================

name: Deploy to Azure

on:
  push:
    branches: [main]

env:
  RESOURCE_GROUP: padtime-rg
  ACR_SERVER: ${{ secrets.AZURE_ACR_SERVER }}

jobs:

  # ===========================================================================
  # JOB 1 — Tests .NET (Domain + Application + Integration)
  # Bloque tout le pipeline si un test échoue
  # ===========================================================================

  test-dotnet:
    name: Tests .NET
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: test_user
          POSTGRES_PASSWORD: test_password
          POSTGRES_DB: padtime_test
        ports:
          - 5434:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore packages
        working-directory: src/BackendApi
        run: dotnet restore

      - name: Build
        working-directory: src/BackendApi
        run: dotnet build --no-restore -c Release

      - name: Tests Domain
        working-directory: src/BackendApi
        run: dotnet test tests/PadTime.Domain.Tests/PadTime.Domain.Tests.csproj --no-build -c Release --logger "trx;LogFileName=domain-results.trx"

      - name: Tests Application
        working-directory: src/BackendApi
        run: dotnet test tests/PadTime.Application.Tests/PadTime.Application.Tests.csproj --no-build -c Release --logger "trx;LogFileName=application-results.trx"

      - name: Tests Integration
        working-directory: src/BackendApi
        env:
          ConnectionStrings__DefaultConnection: "Host=localhost;Port=5434;Database=padtime_test;Username=test_user;Password=test_password"
          Authentication__Authority: "https://localhost:5001"
          Authentication__Audience: "padtime-api"
          ASPNETCORE_ENVIRONMENT: "Test"
        run: dotnet test tests/PadTime.API.IntegrationTests/PadTime.API.IntegrationTests.csproj --no-build -c Release --logger "trx;LogFileName=integration-results.trx"

      - name: Publier résultats tests
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results
          path: src/BackendApi/**/*.trx

  # ===========================================================================
  # JOB 2 — Build & Push IdentityServer
  # ===========================================================================

  build-identity-server:
    name: Build IdentityServer
    runs-on: ubuntu-latest
    needs: test-dotnet
    outputs:
      built: ${{ steps.changed.outputs.any_changed }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Détection changements
        id: changed
        uses: tj-actions/changed-files@v44
        with:
          files: src/IdentityServer/**

      - name: Login ACR
        if: steps.changed.outputs.any_changed == 'true'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.ACR_SERVER }}
          username: ${{ secrets.AZURE_ACR_USERNAME }}
          password: ${{ secrets.AZURE_ACR_PASSWORD }}

      - name: Build & Push
        if: steps.changed.outputs.any_changed == 'true'
        uses: docker/build-push-action@v5
        with:
          context: ./src/IdentityServer
          push: true
          tags: |
            ${{ env.ACR_SERVER }}/padtime/identity-server:latest
            ${{ env.ACR_SERVER }}/padtime/identity-server:${{ github.sha }}

  # ===========================================================================
  # JOB 3 — Build & Push Backend API
  # ===========================================================================

  build-backend-api:
    name: Build Backend API
    runs-on: ubuntu-latest
    needs: test-dotnet
    outputs:
      built: ${{ steps.changed.outputs.any_changed }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Détection changements
        id: changed
        uses: tj-actions/changed-files@v44
        with:
          files: src/BackendApi/**

      - name: Login ACR
        if: steps.changed.outputs.any_changed == 'true'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.ACR_SERVER }}
          username: ${{ secrets.AZURE_ACR_USERNAME }}
          password: ${{ secrets.AZURE_ACR_PASSWORD }}

      - name: Build & Push
        if: steps.changed.outputs.any_changed == 'true'
        uses: docker/build-push-action@v5
        with:
          context: ./src/BackendApi
          push: true
          tags: |
            ${{ env.ACR_SERVER }}/padtime/backend-api:latest
            ${{ env.ACR_SERVER }}/padtime/backend-api:${{ github.sha }}

  # ===========================================================================
  # JOB 4 — Build & Push Frontend Angular
  # Indépendant des tests .NET — tourne en parallèle
  # ===========================================================================

  build-web:
    name: Build Frontend Angular
    runs-on: ubuntu-latest
    outputs:
      built: ${{ steps.changed.outputs.any_changed }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Détection changements
        id: changed
        uses: tj-actions/changed-files@v44
        with:
          files: src/AngularApp/**

      - name: Login ACR
        if: steps.changed.outputs.any_changed == 'true'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.ACR_SERVER }}
          username: ${{ secrets.AZURE_ACR_USERNAME }}
          password: ${{ secrets.AZURE_ACR_PASSWORD }}

      - name: Build & Push
        if: steps.changed.outputs.any_changed == 'true'
        uses: docker/build-push-action@v5
        with:
          context: ./src/AngularApp
          push: true
          tags: |
            ${{ env.ACR_SERVER }}/padtime/web:latest
            ${{ env.ACR_SERVER }}/padtime/web:${{ github.sha }}

  # ===========================================================================
  # JOB 5 — Deploy
  # Attend tous les builds, ne déploie que ce qui a changé
  # ===========================================================================

  deploy:
    name: Deploy to Container Apps
    runs-on: ubuntu-latest
    needs: [build-identity-server, build-backend-api, build-web]
    if: |
      always() &&
      !contains(needs.*.result, 'failure') &&
      !contains(needs.*.result, 'cancelled')

    steps:
      - name: Login Azure
        uses: azure/login@v1
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Deploy IdentityServer
        if: needs.build-identity-server.outputs.built == 'true'
        run: |
          az containerapp update \
            --name identity-server \
            --resource-group ${{ env.RESOURCE_GROUP }} \
            --image ${{ env.ACR_SERVER }}/padtime/identity-server:latest \
            --registry-server ${{ env.ACR_SERVER }} \
            --registry-username ${{ secrets.AZURE_ACR_USERNAME }} \
            --registry-password ${{ secrets.AZURE_ACR_PASSWORD }}

      - name: Deploy Backend API
        if: needs.build-backend-api.outputs.built == 'true'
        run: |
          az containerapp update \
            --name backend-api \
            --resource-group ${{ env.RESOURCE_GROUP }} \
            --image ${{ env.ACR_SERVER }}/padtime/backend-api:latest \
            --registry-server ${{ env.ACR_SERVER }} \
            --registry-username ${{ secrets.AZURE_ACR_USERNAME }} \
            --registry-password ${{ secrets.AZURE_ACR_PASSWORD }}

      - name: Deploy Web
        if: needs.build-web.outputs.built == 'true'
        run: |
          az containerapp update \
            --name web \
            --resource-group ${{ env.RESOURCE_GROUP }} \
            --image ${{ env.ACR_SERVER }}/padtime/web:latest \
            --registry-server ${{ env.ACR_SERVER }} \
            --registry-username ${{ secrets.AZURE_ACR_USERNAME }} \
            --registry-password ${{ secrets.AZURE_ACR_PASSWORD }}

      - name: Deployment Summary
        run: |
          echo "## 🚀 Déploiement PadTime" >> $GITHUB_STEP_SUMMARY
          echo "**Commit**: \`${{ github.sha }}\`" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Service | Statut |" >> $GITHUB_STEP_SUMMARY
          echo "|---------|--------|" >> $GITHUB_STEP_SUMMARY
          echo "| IdentityServer | ${{ needs.build-identity-server.outputs.built == 'true' && '✅ Déployé' || '⏭️ Inchangé' }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Backend API | ${{ needs.build-backend-api.outputs.built == 'true' && '✅ Déployé' || '⏭️ Inchangé' }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Web | ${{ needs.build-web.outputs.built == 'true' && '✅ Déployé' || '⏭️ Inchangé' }} |" >> $GITHUB_STEP_SUMMARY
