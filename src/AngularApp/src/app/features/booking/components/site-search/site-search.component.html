<div class="site-search">
  <p-autocomplete
    (completeMethod)="onComplete($event)"
    (onClear)="onClear()"
    (onSelect)="onSelect($event.value)"
    [(ngModel)]="query"
    [dropdown]="true"
    [forceSelection]="false"
    [placeholder]="placeholder"
    [showClear]="true"
    [suggestions]="filtered"
    optionLabel="name"
  ></p-autocomplete>
</div>
