<section class="shell">
  <header class="header">
    <h1 class="title">Sites</h1>
    <p class="subtitle">Select a site to view available slots</p>
  </header>

  <app-site-search
    (queryChange)="onQueryChange($event)"
    (selectSite)="onSelectSite($event)"
    [sites]="sites()"
  />

  @if (!loading()) {
    <app-sites-grid
      (select)="onCardSelect($event)"
      [linkBase]="'/booking'"
      [selectedSiteId]="selectedSite()?.siteId ?? null"
      [sites]="filteredSites()"
    />
  }
</section>
