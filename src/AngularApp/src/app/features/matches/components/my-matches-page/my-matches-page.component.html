<div class="matches-page">
  <header class="page-header">
    <h1>Mes matchs</h1>
    <a class="btn-book" routerLink="/book">+ Réserver</a>
  </header>

  <div class="filters">
    @for (f of filters; track f.value) {
      <button (click)="setFilter(f.value)" [class.active]="filter() === f.value"
              class="filter-pill" type="button">{{ f.label }}
      </button>
    }
  </div>

  @if (loading()) {
    <div class="state-msg"><i class="pi pi-spin pi-spinner"></i> Chargement…</div>
  } @else if (filtered().length === 0) {
    <div class="empty-state">
      <span class="empty-icon">🎾</span>
      <p class="empty-title">Aucun match trouvé</p>
      <p class="empty-sub">Réservez votre premier créneau !</p>
      <a class="btn-empty" routerLink="/book">Réserver</a>
    </div>
  } @else {
    <div class="match-list">
      @for (match of filtered(); track match.matchId) {
        <app-match-card [match]="match" [sitesMap]="sitesMap()" (paymentDone)="onPaymentDone()"/>
      }
    </div>
  }
</div>
