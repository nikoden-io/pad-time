<ng-container *transloco="let t; scope: 'sites'">
  <p-dialog
    (visibleChange)="onVisibleChange($event)"
    [breakpoints]="{ '640px': '100vw' }"
    [closable]="true"
    [draggable]="false"
    [header]="t(dialogTitle())"
    [modal]="true"
    [style]="{ width: '95vw', maxWidth: '560px' }"
    [visible]="visible()"
  >
    <form [formGroup]="form" class="form-grid">

      <div class="form-section-label">Informations générales</div>

      <div class="form-group">
        <label class="form-label">{{ t('form.name') }} *</label>
        <input
          [class.ng-invalid]="form.get('name')?.invalid && form.get('name')?.touched"
          class="w-full"
          formControlName="name"
          pInputText
        />
        @if (form.get('name')?.hasError('required') && form.get('name')?.touched) {
          <small class="form-error">{{ t('global.validation.required') }}</small>
        }
        @if (form.get('name')?.hasError('minlength') && form.get('name')?.touched) {
          <small class="form-error">{{ t('global.validation.minLength', {min: 3}) }}</small>
        }
      </div>

      <div class="form-section-label">Adresse</div>

      <div class="form-row">
        <div class="form-group" style="flex: 0 0 35%">
          <label class="form-label">{{ t('form.streetNumber') }} *</label>
          <input class="w-full" formControlName="streetNumber" pInputText/>
        </div>
        <div class="form-group">
          <label class="form-label">{{ t('form.street') }} *</label>
          <input class="w-full" formControlName="street" pInputText/>
        </div>
      </div>

      <div class="form-row">
        <div class="form-group" style="flex: 0 0 35%">
          <label class="form-label">{{ t('form.postcode') }} *</label>
          <input class="w-full" formControlName="postcode" pInputText/>
        </div>
        <div class="form-group">
          <label class="form-label">{{ t('form.city') }} *</label>
          <input class="w-full" formControlName="city" pInputText/>
        </div>
      </div>

      <div class="form-group">
        <label class="form-label">{{ t('form.country') }} *</label>
        <input class="w-full" formControlName="country" pInputText/>
      </div>

      <div class="form-section-label">Configuration</div>

      <div class="form-group">
        <label class="form-label">{{ t('form.timezone') }} *</label>
        <p-select
          [options]="timezones"
          [placeholder]="t('form.timezonePlaceholder')"
          formControlName="timezone"
          styleClass="w-full"
        />
      </div>

    </form>

    <ng-template #footer>
      <div class="dialog-footer">
        <button (click)="onVisibleChange(false)" class="btn-cancel" type="button">
          {{ t('global.common.cancel') }}
        </button>
        <button
          (click)="onSubmit()"
          [disabled]="form.invalid || saving()"
          class="btn-save"
          type="button"
        >
          @if (saving()) {
            ⏳
          } {{ t('global.common.save') }}
        </button>
      </div>
    </ng-template>
  </p-dialog>
</ng-container>
