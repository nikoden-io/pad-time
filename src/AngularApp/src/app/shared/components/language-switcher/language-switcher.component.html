<div class="ls-wrap">
  <button
    (click)="toggleOpen()"
    [attr.aria-expanded]="isOpen()"
    aria-label="Changer de langue"
    class="ls-trigger"
    type="button"
  >
    {{ current().flag }}
  </button>

  @if (isOpen()) {
    <div class="ls-dropdown" role="listbox">
      @for (lang of languages; track lang.code) {
        <button
          (click)="select(lang)"
          [attr.aria-selected]="lang.code === current().code"
          [class.selected]="lang.code === current().code"
          class="ls-option"
          role="option"
          type="button"
        >
          {{ lang.flag }}
        </button>
      }
    </div>
  }
</div>
