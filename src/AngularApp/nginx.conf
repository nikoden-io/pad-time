# =============================================================================
# PadTime — Configuration nginx pour Angular SPA
# =============================================================================

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Compression gzip — réduit la taille des fichiers JS/CSS transférés
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;
    gzip_min_length 1000;

    # Cache agressif pour les assets avec hash (fichiers Angular en production)
    # Angular génère des noms comme main.abc123.js — jamais le même nom si le code change
    # On peut donc les cacher très longtemps
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Fichiers i18n (traductions) — cache plus court car peuvent changer
    location /i18n/ {
        expires 1h;
        add_header Cache-Control "public";
    }

    # SPA fallback — CRITIQUE pour Angular Router
    # Sans ça, un refresh sur /booking renverrait 404 (nginx cherche le fichier /booking)
    # Avec ça, toutes les routes inconnues renvoient index.html → Angular Router prend le relais
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Health check endpoint — utilisé par Container Apps pour vérifier que nginx tourne
    location /health {
        access_log off;
        return 200 "healthy\n";
        add_header Content-Type text/plain;
    }
}
